name: Katalog görsellerini indir

# scripts/katalog/gorseller.json değişince listedeki görselleri indirir, WebP'ye çevirir,
# sonucu paket (artifact) olarak saklar; görseller yerelde indirilip commit'lenir.
on:
  push:
    paths:
      - scripts/katalog/gorseller.json

permissions:
  contents: read

concurrency:
  group: katalog-gorselleri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow kur
        run: pip install pillow cairosvg
      - name: Görselleri indir
        run: python3 scripts/katalog-gorsel-indir.py
      - name: Sonucu paket olarak sakla (commit yerelde atılır)
        uses: actions/upload-artifact@v4
        with:
          name: katalog-gorselleri
          path: |
            public/media/urun
            public/media/marka
            scripts/katalog/indirme-raporu.json
          retention-days: 7
